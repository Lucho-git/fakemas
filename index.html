<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ross Family Christmas Quiz</title>
<meta name="description" content="A festive family trivia, riddles and games presentation for Fakemas.">
<meta name="theme-color" content="#1c0306">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&family=Great+Vibes&family=Cormorant+Garamond:wght@500;600;700&family=Oswald:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<canvas id="snow"></canvas>
<div id="prog"></div>
<main id="deck"></main>
<nav id="timeline" aria-label="Jump to a section"></nav>
<nav id="bar" aria-label="Slide controls">
  <button id="prev" aria-label="Previous slide">◀ Back</button>
  <span id="count"></span>
  <button id="next" aria-label="Next slide">Next ▶</button>
  <button id="jingle" aria-label="Music" aria-haspopup="true" aria-expanded="false" aria-controls="music-menu" aria-pressed="true" title="Music (M mutes)">♪</button>
  <button id="reset" aria-label="Reset this slide" title="Reset this slide (R) · Shift-click or Shift+R resets every slide">↺</button>
</nav>
<button id="scores-btn" aria-label="Scoreboard" aria-expanded="false" aria-controls="scores" title="Scoreboard (S)">🏆<span class="sb-lbl"> Scores</span></button>
<aside id="scores" aria-label="Scoreboard" hidden></aside>
<aside id="music-menu" aria-label="Music" hidden></aside>
<aside id="yt-dock" aria-label="Now playing on YouTube" data-corner="br" hidden>
  <button id="yt-move" type="button" aria-label="Move the player to another corner" title="Move the player to another corner">⤢</button>
  <div class="yt-frame" data-channel="jingle"><div id="yt-jingle"></div></div>
  <div class="yt-frame" data-channel="trip"><div id="yt-trip"></div></div>
</aside>
<button id="fs" aria-label="Toggle fullscreen">⛶<span class="fs-lbl"> Fullscreen</span></button>
<audio id="jingle-audio" preload="auto"></audio>
<audio id="trip-audio" preload="auto"></audio>

<script src="assets/js/content.js" defer></script>
<script src="assets/js/slides.js" defer></script>
<script src="assets/js/app.js" defer></script>
</body>
</html>
