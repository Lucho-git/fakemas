<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ross Family Christmas Quiz</title>
<meta name="description" content="A festive family trivia, riddles and games presentation for Fakemas.">
<meta name="theme-color" content="#1c0306">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&family=Great+Vibes&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<canvas id="snow"></canvas>
<div id="prog"></div>
<main id="deck"></main>
<nav id="bar">
  <button id="prev" aria-label="Previous slide">◀ Back</button>
  <span id="count"></span>
  <button id="next" aria-label="Next slide">Next ▶</button>
  <button id="jingle" aria-label="Toggle Christmas jingle music" aria-pressed="true" title="Christmas jingle">♪</button>
</nav>
<button id="fs" aria-label="Toggle fullscreen">⛶ Fullscreen</button>
<audio id="jingle-audio" src="assets/audio/jingle.mp3" loop preload="auto"></audio>

<script src="assets/js/content.js" defer></script>
<script src="assets/js/slides.js" defer></script>
<script src="assets/js/app.js" defer></script>
</body>
</html>
